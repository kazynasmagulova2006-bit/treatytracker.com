async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("tt:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

let n=0;for(const a of Array.isArray(r)?r:[]){if(!a||!a.title||!Array.isArray(a.ll)||!/^[a-z0-9_-]+$/i.test(a.id||"")||T.some(x=>x.id==a.id||x.title==a.title))continue;
const o={id:a.id,title:String(a.title),parties:[].concat(a.parties||[]).map(String),signed:String(a.signed||""),force:String(a.force||""),st:["in force","open","pending"].includes(a.st)?a.st:"pending",tags:[].concat(a.tags||[]).map(String),ll:a.ll.map(Number),sum:String(a.sum||""),src:/^https:\/\//.test(a.src)?a.src:"#",tl:[].concat(a.tl||[]),q:1};
await DB.doc("treaties/"+o.id).set({j:JSON.stringify(o)});n++}m.textContent="Добавлено в очередь: "+n+". Проверьте даты и источники вручную."}catch(e){m.textContent="Не удалось: "+(e.message||e.code||"")}}
